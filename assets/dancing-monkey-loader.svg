<svg  role="img" aria-label="Dancing Monkey audio loading animation" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><style>:root{--primary:#00F0FF;--secondary:#FF007A;--speed:2.4s;--eq-speed:.8s}@keyframes radarPulse {
      0% {
        transform: scale(0.6);
        opacity: 0.8;
      }
      50% {
        opacity: 0.3;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    @keyframes equalizerDance {
      0%, 100% {
        transform: scaleY(0.25);
      }
      50% {
        transform: scaleY(1.15);
      }
    }

    @keyframes headphoneFloat {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      25% {
        transform: translateY(-4px) rotate(-1.5deg);
      }
      75% {
        transform: translateY(4px) rotate(1.5deg);
      }
    }

    @keyframes vinylSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes earWiggleLeft {
      0%, 100% { transform: rotate(0deg) translateX(0); }
      30% { transform: rotate(-5deg) translateX(-1px); }
      70% { transform: rotate(3deg) translateX(0.5px); }
    }

    @keyframes earWiggleRight {
      0%, 100% { transform: rotate(0deg) translateX(0); }
      30% { transform: rotate(5deg) translateX(1px); }
      70% { transform: rotate(-3deg) translateX(-0.5px); }
    }

    .animate-radar-1 {
      animation: radarPulse var(--speed, 2.4s) cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      transform-origin: center;
    }

    .animate-radar-2 {
      animation: radarPulse var(--speed, 2.4s) cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      animation-delay: calc(var(--speed, 2.4s) / 2);
      transform-origin: center;
    }

    .animate-eq {
      transform-origin: bottom;
      animation: equalizerDance var(--eq-speed, 0.8s) ease-in-out infinite alternate;
    }

    .animate-headphone {
      animation: headphoneFloat var(--speed, 2.4s) ease-in-out infinite;
      transform-origin: center;
    }

    .animate-ear-l {
      animation: earWiggleLeft var(--speed, 2.4s) ease-in-out infinite;
      transform-origin: center left;
    }

    .animate-ear-r {
      animation: earWiggleRight var(--speed, 2.4s) ease-in-out infinite;
      transform-origin: center right;
    }

    .animate-vinyl {
      animation: vinylSpin calc(var(--speed, 2.4s) * 2) linear infinite;
      transform-origin: center;
    }

    /* Staggered delay for rhythm visualizer bars */
    .eq-bar-1 { animation-delay: 0.1s; }
    .eq-bar-2 { animation-delay: 0.35s; }
    .eq-bar-3 { animation-delay: 0.15s; }
    .eq-bar-4 { animation-delay: 0.5s; }
    .eq-bar-5 { animation-delay: 0.2s; }
    .eq-bar-6 { animation-delay: 0.4s; }
    .eq-bar-7 { animation-delay: 0.1s; }@media (prefers-reduced-motion: reduce){.animate-radar-1,.animate-radar-2,.animate-eq,.animate-headphone,.animate-ear-l,.animate-ear-r,.animate-vinyl{animation:none!important}}</style>
          <defs>
            <!-- Primary Linear Gradient -->
            <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--primary)" />
              <stop offset="100%" stop-color="var(--secondary)" />
            </linearGradient>

            <!-- Radial Radar Gradient -->
            <radialGradient id="radarGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.4" />
              <stop offset="70%" stop-color="var(--primary)" stop-opacity="0.1" />
              <stop offset="100%" stop-color="var(--primary)" stop-opacity="0" />
            </radialGradient>

            <!-- Glow Filters -->
            <filter id="svgGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- 1. Radar Pulse Searching Rings -->
          <circle class="animate-radar-1" cx="100" cy="100" r="75" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.6" />
          <circle class="animate-radar-2" cx="100" cy="100" r="75" stroke="var(--primary)" stroke-width="1" fill="none" opacity="0.4" />

          <circle cx="100" cy="100" r="85" stroke="#1F2130" stroke-width="1" fill="none" />

          <!-- 2. Central Headphone + Monkey Ear Motif -->
          <g class="animate-headphone">

            <!-- Monkey Ears (Stylized Audio Cushions) -->
            <!-- Left Ear -->
            <g class="animate-ear-l">
              <circle cx="58" cy="100" r="14" fill="#12131C" stroke="url(#primaryGrad)" stroke-width="2.5" filter="url(#svgGlow)" />
              <circle cx="58" cy="100" r="7" fill="var(--primary)" opacity="0.3" />
            </g>
            <!-- Right Ear -->
            <g class="animate-ear-r">
              <circle cx="142" cy="100" r="14" fill="#12131C" stroke="url(#primaryGrad)" stroke-width="2.5" filter="url(#svgGlow)" />
              <circle cx="142" cy="100" r="7" fill="var(--primary)" opacity="0.3" />
            </g>

            <!-- Sleek Headphone Arc -->
            <path d="M 58 95 A 44 44 0 0 1 142 95" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round" filter="url(#svgGlow)" />
            
            <!-- Inner Arch Detail -->
            <path d="M 66 92 A 35 35 0 0 1 134 92" fill="none" stroke="#1F2130" stroke-width="1.5" stroke-dasharray="3 3" />

            <!-- Stylized Vinyl Groove Core (Behind Equalizer) -->
            <circle class="animate-vinyl" cx="100" cy="105" r="28" fill="#0B0C10" stroke="#1F2130" stroke-width="2" />
            <circle class="animate-vinyl" cx="100" cy="105" r="22" stroke="#1A1C28" stroke-width="1" fill="none" stroke-dasharray="8 4" />

            <!-- 3. Dancing Equalizer / Monkey Crown Waveform (Center) -->
            <!-- Positioned at center-bottom of headphone frame -->
            <g transform="translate(100, 105)">
              <!-- 7 Rhythmic Bars -->
              <!-- Bar 1 -->
              <rect class="animate-eq eq-bar-1" x="-21" y="-14" width="3.5" height="28" rx="1.75" fill="var(--primary)" />
              <!-- Bar 2 -->
              <rect class="animate-eq eq-bar-2" x="-14" y="-18" width="3.5" height="36" rx="1.75" fill="var(--primary)" />
              <!-- Bar 3 -->
              <rect class="animate-eq eq-bar-3" x="-7" y="-22" width="3.5" height="44" rx="1.75" fill="url(#primaryGrad)" />
              <!-- Bar 4 (Center Apex - Monkey 'Peak') -->
              <rect class="animate-eq eq-bar-4" x="-1.75" y="-26" width="3.5" height="52" rx="1.75" fill="url(#primaryGrad)" filter="url(#svgGlow)" />
              <!-- Bar 5 -->
              <rect class="animate-eq eq-bar-5" x="3.5" y="-22" width="3.5" height="44" rx="1.75" fill="url(#primaryGrad)" />
              <!-- Bar 6 -->
              <rect class="animate-eq eq-bar-6" x="10.5" y="-18" width="3.5" height="36" rx="1.75" fill="var(--secondary)" />
              <!-- Bar 7 -->
              <rect class="animate-eq eq-bar-7" x="17.5" y="-14" width="3.5" height="28" rx="1.75" fill="var(--secondary)" />
            </g>

            <!-- Subtle Cheek / Music Sparkle Accents -->
            <circle cx="82" cy="118" r="1.5" fill="var(--primary)" opacity="0.8" />
            <circle cx="118" cy="118" r="1.5" fill="var(--secondary)" opacity="0.8" />
          </g>

          <!-- Outer Node / Radar Orbiting Pulse -->
          <g class="animate-vinyl">
            <circle cx="100" cy="15" r="3" fill="var(--primary)" filter="url(#svgGlow)" />
          </g>
        </svg>